name: Ichiban
options:
  bundleIdPrefix: se.ichiban
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true

targets:
  # Apple TV guest board. tvOS has no WebKit at all, so this is a native client
  # against the same public feed the web board uses.
  IchibanBoard:
    type: application
    platform: tvOS
    sources: [Board, Shared]
    info:
      path: Board/Info.plist
      properties:
        CFBundleDisplayName: Ichiban Board
        UILaunchScreen: {}
        # The server is on the restaurant LAN over plain HTTP. Nothing here is
        # ever published to the App Store; guests never talk to this app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription:
          Shows the order board from the restaurant's own server.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.ichiban.board
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO

  # The four iPads. iOS does have WebKit, so each screen is the web page it
  # already serves — a fix reaches every iPad on the next load, no rebuild.
  IchibanScreens:
    type: application
    platform: iOS
    sources: [Screens, Shared]
    info:
      path: Screens/Info.plist
      properties:
        CFBundleDisplayName: Ichiban
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription:
          Connects to the restaurant's own server to show orders.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.ichiban.screens
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
