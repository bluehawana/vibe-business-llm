<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Business — describe your business, get your website</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #faf7f0; color: #2b2a26;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { max-width: 640px; width: 100%; }
  h1 { font-size: 2.4rem; margin-bottom: 8px; color: #2f4436; }
  h1 em { color: #c96f4a; font-style: italic; }
  .sub { font-family: -apple-system, 'Segoe UI', sans-serif; color: #6b675e; margin-bottom: 32px; font-size: 1.05rem; }
  label { display: block; font-family: -apple-system, sans-serif; font-size: .85rem; font-weight: 600;
          color: #6b675e; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  input, textarea { width: 100%; padding: 12px 14px; border: 1px solid #ddd6c8; border-radius: 8px;
          font-size: 1rem; font-family: inherit; background: #fff; }
  textarea { min-height: 130px; resize: vertical; }
  button { margin-top: 24px; width: 100%; padding: 14px; background: #2f4436; color: #fff; border: 0;
          border-radius: 8px; font-size: 1.05rem; cursor: pointer; font-family: inherit; }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { font-family: -apple-system, sans-serif; font-size: .85rem; color: #9b968a; margin-top: 6px; }
  #status { margin-top: 16px; font-family: -apple-system, sans-serif; color: #2f4436; }
</style>
</head>
<body>
<div class="card">
  <h1>Vibe <em>Business</em></h1>
  <p class="sub">Describe your business in your own words — get a complete website with online
     ordering and payments. No code, no technical setup. Keep talking to improve it.</p>
  <form id="form">
    <label for="name">Business name</label>
    <input id="name" required placeholder="e.g. Sjöhästen Sushi">
    <label for="desc">Tell us about your business</label>
    <textarea id="desc" required placeholder="e.g. Familjeägd sushirestaurang i Majorna, Göteborg. Vi vill ha beställning online för avhämtning. Lunchmeny 129 kr..."></textarea>
    <p class="hint">Any language works. Mention your dishes, prices, opening hours — or let us suggest them.</p>
    <button type="submit" id="go">Build my website</button>
  </form>
  <p id="status"></p>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = 'Building your website… this takes a moment.';
  try {
    const res = await fetch('/api/projects', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: document.getElementById('name').value,
                             description: document.getElementById('desc').value })
    });
    if (!res.ok) throw new Error((await res.json()).detail || 'Something went wrong');
    const data = await res.json();
    window.location.href = '/builder/' + data.project_id;
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
