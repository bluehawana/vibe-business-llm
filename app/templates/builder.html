<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ project.name }} — Vibe Business builder</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #efece4; height: 100vh;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: #2f4436; color: #fff; }
  header .brand { font-family: Georgia, serif; font-size: 1.1rem; }
  header .brand em { color: #e8a887; font-style: italic; }
  header .pname { opacity: .8; font-size: .9rem; }
  header .links { margin-left: auto; display: flex; gap: 14px; }
  header a { color: #e8e4d8; font-size: .85rem; text-decoration: none; border: 1px solid #ffffff44;
             padding: 5px 12px; border-radius: 6px; }
  main { flex: 1; display: flex; min-height: 0; }
  .chat { width: 380px; min-width: 300px; display: flex; flex-direction: column; background: #faf7f0;
          border-right: 1px solid #ddd6c8; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; font-size: .92rem; line-height: 1.45; max-width: 92%;
         white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2f4436; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e5dfd2; border-bottom-left-radius: 4px; }
  .msg.pending { color: #9b968a; font-style: italic; background: transparent; border: 0; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd6c8; }
  .composer textarea { flex: 1; padding: 10px 12px; border: 1px solid #ddd6c8; border-radius: 8px;
         font-family: inherit; font-size: .95rem; resize: none; height: 60px; }
  .composer button { padding: 0 18px; background: #c96f4a; color: #fff; border: 0; border-radius: 8px;
         cursor: pointer; font-size: .95rem; }
  .composer button:disabled { opacity: .5; cursor: wait; }
  .preview { flex: 1; display: flex; flex-direction: column; }
  .preview .bar { padding: 8px 14px; font-size: .8rem; color: #6b675e; background: #e5e1d6;
         display: flex; justify-content: space-between; }
  iframe { flex: 1; border: 0; background: #fff; width: 100%; }
</style>
</head>
<body>
<header>
  <span class="brand">Vibe <em>Business</em></span>
  <span class="pname">{{ project.name }}</span>
  <span class="links">
    <a href="/site/{{ project.id }}" target="_blank">Open live site ↗</a>
    <a href="/admin/{{ project.id }}/orders" target="_blank">Orders</a>
  </span>
</header>
<main>
  <section class="chat">
    <div class="msgs" id="msgs">
      {% for m in messages %}
      <div class="msg {{ m.role }}">{{ m.content }}</div>
      {% endfor %}
    </div>
    <div class="composer">
      <textarea id="input" placeholder="e.g. Lägg till en vegetarisk kategori, och gör sidan lite varmare i färgerna"></textarea>
      <button id="send">Send</button>
    </div>
  </section>
  <section class="preview">
    <div class="bar"><span>Live preview — updates after every message</span><span id="pstate"></span></div>
    <iframe id="frame" src="/site/{{ project.id }}"></iframe>
  </section>
</main>
<script>
const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
const send = document.getElementById('send');
const frame = document.getElementById('frame');
msgs.scrollTop = msgs.scrollHeight;

function addMsg(role, text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + (cls || role);
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send.disabled = true;
  addMsg('user', text);
  const pending = addMsg('assistant', 'Updating your website…', 'pending');
  try {
    const res = await fetch('/api/projects/{{ project.id }}/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text })
    });
    if (!res.ok) throw new Error((await res.json()).detail || 'request failed');
    const data = await res.json();
    pending.remove();
    addMsg('assistant', data.reply);
    frame.src = frame.src.split('#')[0]; // reload preview
  } catch (err) {
    pending.remove();
    addMsg('assistant', 'Error: ' + err.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
}
send.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
</html>
