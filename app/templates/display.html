<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ project.name }} — beställningar</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #12140f; color: #f4f1e8;
         display: flex; flex-direction: column; overflow: hidden; }
  header { text-align: center; padding: 2vh 24px 1.4vh; }
  header h1 { font-size: 2.6vw; font-weight: 700; }
  header .name { color: #e0a11b; }
  .cols { flex: 1; display: grid; grid-template-columns: 1fr 1.25fr; gap: 3px; background: #2a2c22;
          min-height: 0; }
  .col { background: #12140f; padding: 2vh 2vw; overflow: hidden; display: flex; flex-direction: column; }
  .col h2 { font-size: 1.9vw; margin-bottom: 1.6vh; padding-bottom: .8vh; border-bottom: 4px solid;
            display: flex; align-items: center; gap: .6vw; }
  .col.prep h2 { color: #e2b93b; border-color: #e2b93b; }
  .col.ready h2 { color: #52b788; border-color: #52b788; }
  /* Half the guests walk over from the Liseberg hotels — both languages, always. */
  .col h2 .en { font-size: .72em; font-weight: 400; opacity: .62; }
  .nums { display: flex; flex-wrap: wrap; gap: 1.2vw 1vw; align-content: flex-start; overflow: hidden; }
  .num { font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 14px;
         padding: .5vh 1.6vw; line-height: 1.15; }
  .col.prep .num { font-size: 3.4vw; background: #2e2a14; color: #f0d570; }
  /* Ready numbers are the ones people are scanning for from across the room:
     bigger, brighter, and moving so a glance catches them. */
  .col.ready .num { font-size: 4.6vw; background: #1c4029; color: #8bf0b5;
                    box-shadow: 0 0 0 3px #52b788 inset; }
  .col.ready .num.fresh { animation: pop 1.1s ease-in-out infinite; }
  @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .empty { opacity: .3; font-size: 1.5vw; margin-top: 1.4vh; }
  footer { text-align: center; padding: 1.2vh; font-size: 1.1vw; color: #6d7062; }
</style>
</head>
<body>
<header><h1>🍜 <span class="name">{{ project.name }}</span></h1></header>
<div class="cols">
  <div class="col prep"><h2>👨‍🍳 Tillagas <span class="en">Preparing</span></h2>
    <div class="nums" id="prep"></div></div>
  <div class="col ready"><h2>✅ Klar <span class="en">Ready — collect your food</span></h2>
    <div class="nums" id="ready"></div></div>
</div>
<footer>Ditt nummer står på kvittot · Your number is on your receipt</footer>
<script>
const PID = "{{ project.id }}";
// Numbers that JUST turned ready keep pulsing for a while, then settle down so
// the animation always means "this one is new", not "the screen is busy".
const FRESH_MS = 45000;
const readySince = new Map();

const label = o => o.order_no;

async function refresh() {
  let orders;
  try {
    orders = (await (await fetch(`/api/display/${PID}`)).json()).orders;
  } catch (err) { return; }  // a TV left on overnight must survive the server restarting
  const prep = orders.filter(o => o.fulfillment === "new" || o.fulfillment === "preparing");
  const ready = orders.filter(o => o.fulfillment === "ready");

  const now = Date.now();
  const live = new Set(ready.map(label));
  for (const id of readySince.keys()) if (!live.has(id)) readySince.delete(id);
  for (const o of ready) if (!readySince.has(label(o))) readySince.set(label(o), now);

  document.getElementById("prep").innerHTML = prep.length
    ? prep.map(o => `<span class="num">${label(o)}</span>`).join("")
    : '<p class="empty">—</p>';
  document.getElementById("ready").innerHTML = ready.length
    ? ready.map(o => {
        const fresh = now - readySince.get(label(o)) < FRESH_MS ? " fresh" : "";
        return `<span class="num${fresh}">${label(o)}</span>`;
      }).join("")
    : '<p class="empty">—</p>';
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
