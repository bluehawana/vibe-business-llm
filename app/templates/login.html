<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff login</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #faf7f0; color: #2b2a26;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border: 1px solid #e5dfd2; border-radius: 14px; padding: 32px 28px;
          width: 100%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
  h1 { font-family: Georgia, serif; color: #2f4436; font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: #6b675e; font-size: .88rem; margin-bottom: 20px; }
  label { font-size: .8rem; font-weight: 600; display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
  button { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 8px;
           background: #2f4436; color: #fff; font-size: 1rem; cursor: pointer; }
  .bad { background: #fbe4de; border: 1px solid #e8b8a8; color: #8a3a14; border-radius: 8px;
         padding: 10px 12px; font-size: .85rem; margin-bottom: 16px; }
  .setup { background: #fff4d6; border: 1px solid #e8d9a0; border-radius: 8px; padding: 12px 14px;
           font-size: .85rem; line-height: 1.5; }
  code { background: #f3ecd4; padding: 1px 6px; border-radius: 4px; font-size: .9em; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Staff login</h1>
  <p class="sub">Kitchen, reception, pay and admin screens.</p>

  {% if not configured %}
  <div class="setup">
    No staff password is set, so the staff screens are switched off.
    Add <code>VIBE_STAFF_PASSWORD=…</code> to <code>.env</code> on the Mac mini and restart
    with <code>./run.sh</code>.
  </div>
  {% else %}
  {% if bad %}<div class="bad">Wrong password.</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autofocus autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
  {% endif %}
</div>
</body>
</html>
